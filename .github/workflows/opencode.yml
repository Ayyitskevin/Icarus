name: opencode

# Hardened under ADR 0025, which resolves the ADR 0010 security hold via the
# hardening option. The repository-owned actor gate in the `authorize` job runs
# before any third-party code and is the authorization boundary; the upstream
# action's own collaborator check is not, because it runs after mutable
# bootstrap code has already started.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Deny by default. Each job re-grants only what it needs.
permissions: {}

jobs:
  # Repository-owned authorization. Uses no third-party actions, receives no
  # secrets, and holds no permissions, so nothing outside this file can run
  # until the actor has been accepted.
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      (
        startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /oc') ||
        contains(github.event.comment.body, ' /opencode')
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    steps:
      # Untrusted comment fields reach the shell only through the environment,
      # never through `${{ }}` interpolation inside `run:`.
      - name: Record the authorized invocation
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          printf 'authorized actor=%s association=%s\n' "$ACTOR" "$ASSOCIATION"

  opencode:
    needs: authorize
    runs-on: ubuntu-latest
    # Defence in depth behind the actor gate. This does nothing until the
    # `opencode` environment carries required reviewers in repository settings;
    # see ADR 0025.
    environment: opencode
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      # Pinned to the v6.1.0 commit. `v6` is a mutable tag.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # Pinned to the commit that `latest` dereferenced to on 2026-07-26.
      # `latest` is a mutable annotated tag. This pin makes the reference
      # immutable; it does NOT constitute a review of the pinned contents,
      # which ADR 0025 records as outstanding.
      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-sonnet-4-6
          # Public repositories default to shared sessions otherwise.
          share: false
